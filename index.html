<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#090d16" id="metaThemeColor">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Material Acaciophone</title>
  <link rel="manifest" id="pwa-manifest">
  <style>
    :root {
      --bg: #090d16;
      --surface: #111827;
      --surface-2: #1f2937;
      --line: rgba(255, 255, 255, 0.07);
      --text: #f3f4f6;
      --muted: #6b7280;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.12);
      --success: #10b981;
      --success-soft: rgba(16, 185, 129, 0.12);
      --warning: #f59e0b;
      --danger: #ef4444;
    }
    body.light-mode {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-2: #f1f5f9;
      --line: rgba(15, 23, 42, 0.08);
      --text: #0f172a;
      --muted: #64748b;
      --accent: #0284c7;
      --accent-soft: rgba(2, 132, 199, 0.1);
      --success: #059669;
      --success-soft: rgba(5, 150, 105, 0.1);
      --warning: #d97706;
      --danger: #dc2626;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 90px;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
    }

    /* Cabecera fluida y limpia */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(9, 13, 22, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
      padding: 8px 16px 12px;
    }
    body.light-mode header {
      background: rgba(248, 250, 252, 0.88);
    }
    .header-inner { max-width: 640px; margin: 0 auto; }

    /* Navegación minimalista sin cajas */
    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .tabs {
      display: flex;
      gap: 20px;
    }
    .tab-link {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 0.92rem;
      font-weight: 700;
      padding: 6px 0;
      cursor: pointer;
      position: relative;
      transition: color 0.15s;
    }
    .tab-link.active {
      color: var(--text);
    }
    .tab-link.active::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 2.5px;
      background: var(--accent);
      border-radius: 2px;
    }
    .theme-toggle {
      background: none;
      border: none;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 4px;
      opacity: 0.8;
    }

    /* Buscador limpio tipo píldora */
    .search-wrap {
      position: relative;
      margin-bottom: 10px;
    }
    .search-wrap input {
      width: 100%;
      padding: 11px 38px 11px 16px;
      border-radius: 24px;
      border: 1px solid transparent;
      background: var(--surface);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s, background 0.15s;
    }
    body.light-mode .search-wrap input {
      background: var(--surface-2);
    }
    .search-wrap input:focus {
      border-color: var(--accent);
      background: var(--surface);
    }
    .search-wrap input::placeholder { color: var(--muted); }
    .clear-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--muted);
      font-size: 1rem;
      padding: 6px;
      cursor: pointer;
      display: none;
    }

    /* Píldoras de filtro suaves */
    .pills-bar {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .pill {
      border: none;
      background: var(--surface);
      color: var(--muted);
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      max-width: 100%;
      overflow: hidden;
    }
    body.light-mode .pill { background: var(--surface-2); }
    .pill span.truncate {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .pill.active {
      background: var(--accent-soft);
      color: var(--accent);
    }

    /* Contenedor Principal */
    main { max-width: 640px; margin: 0 auto; padding: 4px 16px; }

    /* Chip de tabla activa tras conflicto */
    .scope-chip {
      display: none;
      align-items: center;
      justify-content: space-between;
      background: var(--accent-soft);
      color: var(--accent);
      padding: 7px 14px;
      border-radius: 20px;
      margin: 8px 0 4px;
      font-size: 0.78rem;
      font-weight: 600;
    }
    .scope-chip button {
      background: none;
      border: none;
      color: var(--accent);
      font-weight: 800;
      font-size: 0.76rem;
      cursor: pointer;
      text-decoration: underline;
    }

    /* Lista de catálogo minimalista sin recuadros */
    .materials-list {
      display: flex;
      flex-direction: column;
    }
    .mat-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding: 13px 4px;
      border-bottom: 1px solid var(--line);
      cursor: pointer;
      gap: 12px;
      transition: opacity 0.1s;
    }
    .mat-row:active { opacity: 0.6; }
    .mat-code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.9rem;
      font-weight: 800;
      color: var(--accent);
      min-width: 48px;
      flex-shrink: 0;
    }
    .mat-code.sc {
      color: var(--warning);
      font-size: 0.72rem;
    }
    .mat-body {
      flex: 1;
      min-width: 0;
    }
    .mat-name {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text);
    }
    .mat-table-tag {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--muted);
      margin-left: 4px;
    }
    .mat-qty-badge {
      background: var(--success-soft);
      color: var(--success);
      font-size: 0.75rem;
      font-weight: 800;
      padding: 2px 9px;
      border-radius: 12px;
      flex-shrink: 0;
      align-self: center;
    }

    /* Enlace discreto para material puntual */
    .puntual-link-wrap {
      text-align: center;
      padding: 22px 0 28px;
    }
    .puntual-link {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      padding: 6px 12px;
    }
    .puntual-link:active { color: var(--accent); }

    /* =======================================================
       ALBARÁN DE PEDIDO (Elegante, limpio y diferenciado)
       ======================================================= */
    .albaran-card {
      background: var(--surface);
      border-left: 3.5px solid var(--success);
      border-radius: 14px;
      padding: 16px;
      margin-top: 8px;
      display: none;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    }
    body.light-mode .albaran-card {
      box-shadow: 0 6px 20px rgba(15, 23, 42, 0.06);
    }
    .albaran-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
    }
    .albaran-title {
      font-size: 0.82rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--success);
    }
    .text-btn {
      background: none;
      border: none;
      color: var(--accent);
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }
    .edit-kit-bar {
      display: none;
      justify-content: space-between;
      align-items: center;
      background: var(--accent-soft);
      padding: 8px 12px;
      border-radius: 8px;
      margin-top: 10px;
      font-size: 0.8rem;
    }

    /* Filas numeradas del Albarán sin marcos */
    .albaran-list {
      display: flex;
      flex-direction: column;
      margin-bottom: 16px;
    }
    .alb-row {
      display: flex;
      align-items: center;
      padding: 11px 0;
      border-bottom: 1px solid var(--line);
      gap: 10px;
    }
    .alb-num {
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 0.75rem;
      color: var(--muted);
      width: 22px;
      flex-shrink: 0;
    }
    .alb-qty {
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 0.86rem;
      font-weight: 800;
      color: var(--success);
      min-width: 44px;
      flex-shrink: 0;
    }
    .alb-info {
      flex: 1;
      min-width: 0;
      cursor: pointer;
    }
    .alb-code {
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--text);
    }
    .alb-desc {
      font-size: 0.8rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .alb-row.expanded .alb-desc {
      white-space: normal;
      overflow: visible;
      color: var(--text);
      margin-top: 2px;
    }
    .alb-prov {
      display: none;
      font-size: 0.72rem;
      color: var(--accent);
      margin-top: 2px;
    }
    .alb-row.expanded .alb-prov { display: block; }

    .alb-ctrls {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .circle-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: none;
      background: var(--surface-2);
      color: var(--text);
      font-weight: 700;
      font-size: 0.92rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .circle-btn.del {
      color: var(--danger);
      background: rgba(239, 68, 68, 0.1);
      font-size: 0.78rem;
    }

    /* Acciones del Albarán */
    .albaran-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn-primary-copy {
      width: 100%;
      padding: 13px;
      border-radius: 12px;
      border: none;
      background: var(--success);
      color: #fff;
      font-weight: 700;
      font-size: 0.92rem;
      cursor: pointer;
    }
    .secondary-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2px 4px 0;
    }
    .sec-link {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      padding: 6px;
    }
    .sec-link.danger { color: var(--danger); }

    /* Píldora Flotante Inferior */
    .floating-pill {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--success);
      color: #fff;
      padding: 11px 22px;
      border-radius: 30px;
      display: none;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 0.86rem;
      z-index: 40;
      box-shadow: 0 8px 24px rgba(16, 185, 129, 0.4);
      cursor: pointer;
      white-space: nowrap;
    }

    /* Vista Traductor Almacén */
    #translatorView { display: none; padding-top: 8px; }
    .trans-header {
      display: flex;
      justify-content: flex-end;
      gap: 14px;
      margin-bottom: 8px;
    }
    .trans-textarea {
      width: 100%;
      min-height: 110px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      color: var(--text);
      padding: 12px 14px;
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 0.88rem;
      outline: none;
      resize: vertical;
      margin-bottom: 14px;
    }
    .trans-textarea:focus { border-color: var(--accent); }
    .trans-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 13px 4px;
      border-bottom: 1px solid var(--line);
      cursor: pointer;
    }
    .trans-row.checked { opacity: 0.35; }
    .trans-check {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid var(--muted);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 2px;
      font-size: 0.7rem;
      color: transparent;
    }
    .trans-row.checked .trans-check {
      background: var(--success);
      border-color: var(--success);
      color: #fff;
    }

    /* Modales Limpios */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 100;
    }
    .modal-backdrop.open { display: flex; }
    .modal-backdrop.center-modal {
      align-items: center;
      padding: 18px;
    }
    .modal-sheet {
      background: var(--surface);
      border-radius: 22px 22px 0 0;
      width: 100%;
      max-width: 640px;
      padding: 14px 20px 28px;
      max-height: 85vh;
      overflow-y: auto;
      animation: slideUp 0.16s ease-out;
    }
    .modal-dialog {
      background: var(--surface);
      border-radius: 18px;
      width: 100%;
      max-width: 400px;
      padding: 20px;
      max-height: 85vh;
      overflow-y: auto;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .sheet-handle {
      width: 36px;
      height: 4px;
      background: var(--line);
      border-radius: 4px;
      margin: 0 auto 14px;
    }
    .m-meta { font-size: 0.75rem; font-weight: 700; color: var(--accent); }
    .m-title { font-size: 1rem; font-weight: 700; color: var(--text); margin: 4px 0 16px; }

    /* Opciones del modal de conflicto */
    .conflict-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .conflict-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      padding: 13px 14px;
      border-radius: 12px;
      border: none;
      background: var(--surface-2);
      color: var(--text);
      font-size: 0.86rem;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
    }
    .conflict-item:active { background: var(--accent-soft); color: var(--accent); }
    .conflict-badge {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent);
      margin-left: 8px;
      flex-shrink: 0;
    }

    /* Controles dentro del modal de unidades */
    .field { margin-bottom: 12px; }
    .field input, .field select {
      width: 100%;
      padding: 11px 14px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--text);
      font-size: 0.92rem;
      outline: none;
    }
    .qty-stepper {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .qty-stepper input {
      flex: 1;
      text-align: center;
      font-size: 1.5rem;
      font-weight: 800;
      padding: 8px;
      border-radius: 12px;
      border: none;
      background: var(--bg);
      color: var(--text);
      width: 100%;
    }
    .step-btn {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      border: none;
      background: var(--surface-2);
      color: var(--text);
      font-size: 1.3rem;
      font-weight: 600;
      cursor: pointer;
    }
    .quick-pills {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .q-pill {
      flex: 1;
      min-width: 54px;
      padding: 8px 6px;
      border-radius: 10px;
      border: none;
      background: var(--surface-2);
      color: var(--text);
      font-weight: 600;
      font-size: 0.82rem;
      cursor: pointer;
      text-align: center;
    }
    .cable-pills {
      display: none;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .cable-pill {
      padding: 6px 11px;
      border-radius: 16px;
      border: none;
      background: rgba(245, 158, 11, 0.14);
      color: var(--warning);
      font-size: 0.76rem;
      font-weight: 700;
      cursor: pointer;
    }
    .m-footer { display: flex; gap: 10px; margin-top: 16px; }
    .m-footer button {
      flex: 1;
      padding: 13px;
      border-radius: 12px;
      border: none;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .btn-cancel { background: var(--surface-2); color: var(--muted); }
    .btn-ok { background: var(--accent); color: #090d16; }
    body.light-mode .btn-ok { color: #fff; }

    /* Lista limpia de Tablas en el modal */
    .cat-group-title {
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 16px 0 6px;
    }
    .cat-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      padding: 11px 8px;
      border: none;
      border-bottom: 1px solid var(--line);
      background: none;
      color: var(--text);
      font-size: 0.86rem;
      text-align: left;
      cursor: pointer;
    }
    .cat-item.active {
      color: var(--accent);
      font-weight: 700;
    }
    .cat-count {
      font-size: 0.76rem;
      color: var(--muted);
    }

    /* Lista de Kits */
    .kit-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
      gap: 10px;
    }
    .kit-title { font-weight: 700; font-size: 0.9rem; color: var(--text); }
    .kit-sub { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }

    .toast {
      position: fixed;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--text);
      color: var(--bg);
      padding: 9px 18px;
      border-radius: 24px;
      font-weight: 700;
      font-size: 0.82rem;
      display: none;
      z-index: 200;
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="nav-bar">
      <div class="tabs">
        <button class="tab-link active" id="tabOrderBtn" onclick="switchMode('order')">Pedido</button>
        <button class="tab-link" id="tabTransBtn" onclick="switchMode('translator')">Traductor</button>
      </div>
      <button class="theme-toggle" id="themeBtn" onclick="toggleTheme()">☀️</button>
    </div>

    <div id="orderHeaderTools">
      <div class="search-wrap">
        <form onsubmit="handleSearchSubmit(event)" style="margin:0;">
          <input type="search" id="searchInput" enterkeyhint="search" placeholder="Buscar material o código..." autocomplete="off">
        </form>
        <button type="button" class="clear-btn" id="clearSearchBtn" onclick="clearSearch()">✕</button>
      </div>
      <div class="pills-bar">
        <button class="pill" id="catTriggerBtn" onclick="openCategoriesModal()">
          <span class="truncate" id="selectedCatLabel">Todas las tablas</span>
          <span>▾</span>
        </button>
        <button class="pill" id="kitsBtn" onclick="openKitsModal()">Kits (0)</button>
      </div>
    </div>
  </div>
</header>

<main>
  <!-- VISTA 1: PEDIDO -->
  <div id="orderView">
    <div class="scope-chip" id="activeScopeBar">
      <span id="activeScopeName"></span>
      <button onclick="reopenConflictModal()">Cambiar</button>
    </div>

    <div class="materials-list" id="materialsList"></div>

    <div class="puntual-link-wrap">
      <button class="puntual-link" onclick="openPuntualModal()">+ Material puntual sin código</button>
    </div>

    <!-- ALBARÁN DE PEDIDO -->
    <section class="albaran-card" id="orderSection">
      <div class="albaran-head">
        <span class="albaran-title">Albarán (<span id="cartCount">0</span>)</span>
        <button class="text-btn" onclick="promptSaveCurrentAsKit()">Guardar Kit</button>
      </div>

      <div class="edit-kit-bar" id="editKitBanner">
        <span>Editando: <strong id="editingKitName"></strong></span>
        <div style="display:flex;gap:12px;">
          <button class="text-btn" onclick="saveEditedKit()">Guardar</button>
          <button class="text-btn" style="color:var(--muted);" onclick="cancelEditKit()">Salir</button>
        </div>
      </div>

      <div class="albaran-list" id="cartTableBody"></div>

      <div class="albaran-actions">
        <button class="btn-primary-copy" onclick="copyOrder()">Copiar pedido</button>
        <div class="secondary-actions">
          <button class="sec-link" onclick="sendEmail()">Enviar correo</button>
          <button class="sec-link" onclick="sendWhatsApp()">WhatsApp</button>
          <button class="sec-link danger" onclick="clearCart()">Vaciar</button>
        </div>
      </div>
    </section>
  </div>

  <!-- VISTA 2: TRADUCTOR -->
  <div id="translatorView">
    <div class="trans-header">
      <button class="text-btn" onclick="pasteFromClipboard()">Pegar</button>

function norm(s) {
  return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}

function getSingularVariants(word) {
  const variants = [word];
  if (word.length > 4 && word.endsWith("ces")) variants.push(word.slice(0, -3) + "z");
  if (word.length > 4 && word.endsWith("es")) variants.push(word.slice(0, -2));
  if (word.length > 3 && word.endsWith("s")) variants.push(word.slice(0, -1));
  return variants;
}

function getSynonymsForItem(code, name, tableIdx) {
  const extra = [];
  if (code === "4101") extra.push("canula canulas tubito tubitos smouv smouvs canutillo canutillos protector protectores fusion fusiones empalme empalmes manguito manguitos");
  if (tableIdx === 9) extra.push("termico termicos pia pias automatico automaticos magneto magnetos magnetotermico magnetotermicos cuadro cuadros diferencial diferenciales sobretension sobretensiones");
  if (tableIdx === 29 || code === "2429") extra.push("divisor divisores repartidor repartidores splitter splitters");
  if (tableIdx === 0) extra.push("ont onts router routers wifi domestico domesticos cliente clientes repetidor repetidores");
  if (tableIdx === 23) extra.push("torpedo torpedos botella botellas sangrado sangrados empalme empalmes nodo nodos");
  if (tableIdx === 18) extra.push("sfp sfps gbic gbics optico opticos transceiver transceivers modulo modulos");
  if (tableIdx === 12 || tableIdx === 22) extra.push("utp ftp rj45 ethernet red cat5 cat5e cat6 lan cable cables bobina bobinas");
  if (tableIdx === 30 || tableIdx === 31 || tableIdx === 10) extra.push("tensor tensores cuna cunas amarre amarres herraje herrajes poste postes fachada fachadas fijacion fijaciones pinza pinzas grapa grapas retenedor retenedores mastil mastiles garra garras tirafondo tirafondos");
  if (tableIdx === 14 || name.includes("HPOW") || name.includes("POE")) extra.push("alimentador alimentadores transformador transformadores fuente fuentes inyector inyectores poe");
  if (tableIdx === 21) extra.push("bandeja bandejas repartidor repartidores odf odfs");
  if (tableIdx === 3) extra.push("roseta rosetas adaptador adaptadores enfrentador enfrentadores");
  if (tableIdx === 28) extra.push("enfrentador enfrentadores adaptador adaptadores acoplador acopladores");

  if (name.includes("PIGATIL")) extra.push("pigtail pigtails");
  if (name.includes("PERCONECTORIZADO")) extra.push("preconectorizado preconectorizados");
  if (name.includes("TIRAFONO")) extra.push("tirafondo tirafondos");
  if (name.includes("RETENDOR")) extra.push("retenedor retenedores");
  if (name.includes("ADROID")) extra.push("android");
  if (name.includes("MIKEOTIK")) extra.push("mikrotik");

  return extra.join(" ");
}

const MATERIALS = RAW_DATA.map((r, i) => {
  const code = r[0];
  const name = r[1];
  const tIdx = r[2];
  const prov = r[3];
  const sheetName = TABLES[tIdx][0];
  const tableName = TABLES[tIdx][1];
  const syns = getSynonymsForItem(code, name, tIdx);
  return {
    id: i,
    code,
    name,
    tIdx,
    sheetName,
    tableName,
    prov,
    search: norm(`${code} ${name} ${tableName} ${prov} ${syns}`)
  };
});

function itemMatchesToken(matSearchStr, token) {
  return getSingularVariants(token).some(v => matSearchStr.includes(v));
}

function detectConflictFamily(tokens) {
  if (!tokens.length) return null;
  if (tokens.includes("acometida") || tokens.includes("acometidas")) return CONFLICT_FAMILIES[0];
  for (const fam of CONFLICT_FAMILIES) {
    if (tokens.some(t => fam.words.includes(t))) return fam;
  }
  return null;
}

function chooseConflictTableFromModal(tIdx) {
  resolvedConflictTable = tIdx;
  document.getElementById("conflictModal").classList.remove("open");
  window.scrollTo({ top: 0, behavior: "instant" });

  const currVal = searchInput.value;
  if (currVal && !currVal.endsWith(" ")) {
    searchInput.value = currVal + " ";
  }
  searchInput.focus();
  const len = searchInput.value.length;
  searchInput.setSelectionRange(len, len);

  renderMaterials();
}

function reopenConflictModal() {
  resolvedConflictTable = null;
  renderMaterials();
}

function renderMaterials() {
  const q = norm(searchInput.value.trim());
  const tokens = q ? q.split(/\s+/) : [];
  const scopeBar = document.getElementById("activeScopeBar");
  const listEl = document.getElementById("materialsList");

  const textMatches = MATERIALS.filter(m => {
    for (const t of tokens) {
      if (!itemMatchesToken(m.search, t)) return false;
    }
    return true;
  });

  if (selectedTable === "ALL" && tokens.length > 0) {
    const fam = detectConflictFamily(tokens);
    if (fam) {
      if (activeConflictFamilyId !== fam.id) {
        activeConflictFamilyId = fam.id;
        resolvedConflictTable = null;
      }

      const matchingTables = [];
      fam.tables.forEach(tIdx => {
        const count = textMatches.filter(m => m.tIdx === tIdx).length;
        if (count > 0) {
          matchingTables.push({ tIdx, tableName: TABLES[tIdx][1], count });
        }
      });

      if (matchingTables.length > 1) {
        if (resolvedConflictTable === null) {
          searchInput.blur();
          scopeBar.style.display = "none";
          listEl.innerHTML = "";
          document.getElementById("conflictModalOptions").innerHTML = matchingTables.map(mt => `
            <button type="button" class="conflict-item" onclick="chooseConflictTableFromModal(${mt.tIdx})">
              <span>${mt.tableName}</span>
              <span class="conflict-badge">${mt.count}</span>
            </button>
          `).join("");
          document.getElementById("conflictModal").classList.add("open");
          return;
        } else {
          scopeBar.style.display = "flex";
          document.getElementById("activeScopeName").textContent = TABLES[resolvedConflictTable][1];
        }
      } else {
        scopeBar.style.display = "none";
      }
    } else {
      activeConflictFamilyId = null;
      resolvedConflictTable = null;
      scopeBar.style.display = "none";
    }
  } else {
    scopeBar.style.display = "none";
  }

  let finalItems = textMatches;
  if (selectedTable !== "ALL") {
    finalItems = textMatches.filter(m => m.tIdx === selectedTable);
  } else if (resolvedConflictTable !== null) {
    finalItems = textMatches.filter(m => m.tIdx === resolvedConflictTable);
  }

  finalItems.sort((a, b) => {
    if (q && a.code.toLowerCase() === q) return -1;
    if (q && b.code.toLowerCase() === q) return 1;
    return 0;
  });

  const cartMap = {};
  cart.forEach(c => { cartMap[c.key] = c.qty; });

  const limit = (!q && selectedTable === "ALL" && resolvedConflictTable === null) ? 80 : finalItems.length;

  listEl.innerHTML = finalItems.slice(0, limit).map(m => {
    const key = m.code !== "SIN CÓDIGO" ? `${m.code}_${m.tIdx}` : `SC_${m.name}_${m.tIdx}`;
    const qtyInCart = cartMap[key];
    const isSC = m.code === "SIN CÓDIGO";
    return `
      <div class="mat-row" onclick="openCatalogModal(${m.id})">
        <span class="mat-code ${isSC ? 'sc' : ''}">${isSC ? 'S/C' : m.code}</span>
        <div class="mat-body">
          <span class="mat-name">${m.name}</span>
          <span class="mat-table-tag">(${m.tableName})</span>
        </div>
        ${qtyInCart ? `<span class="mat-qty-badge">${qtyInCart}</span>` : ''}
      </div>
    `;
  }).join("");
}

function openCategoriesModal() {
  const container = document.getElementById("categoriesContainer");
  const counts = {};
  MATERIALS.forEach(m => { counts[m.tIdx] = (counts[m.tIdx] || 0) + 1; });

  const groups = {};
  TABLES.forEach((t, idx) => {
    if (!groups[t[0]]) groups[t[0]] = [];
    groups[t[0]].push({ idx, title: t[1], count: counts[idx] || 0 });
  });

  let html = `
    <button class="cat-item ${selectedTable === 'ALL' ? 'active' : ''}" onclick="selectTableFilter('ALL')">
      <span>Todas las tablas</span>
      <span class="cat-count">${MATERIALS.length}</span>
    </button>
  `;

  Object.keys(groups).forEach(sheetName => {
    html += `<div class="cat-group-title">${sheetName}</div>`;
    groups[sheetName].forEach(tb => {
      html += `
        <button class="cat-item ${selectedTable === tb.idx ? 'active' : ''}" onclick="selectTableFilter(${tb.idx})">
          <span>${tb.title}</span>
          <span class="cat-count">${tb.count}</span>
        </button>
      `;
    });
  });

  container.innerHTML = html;
  document.getElementById("categoriesModal").classList.add("open");
}

  selectedTable = val;
  resolvedConflictTable = null;
  const labelEl = document.getElementById("selectedCatLabel");
  const triggerBtn = document.getElementById("catTriggerBtn");
  if (val === "ALL") {
    labelEl.textContent = "Todas las tablas";
    triggerBtn.classList.remove("active");
  } else {
    labelEl.textContent = TABLES[val][1];
    triggerBtn.classList.add("active");
  }
  closeModals();
  renderMaterials();
  window.scrollTo({ top: 0, behavior: "instant" });
}

function openCatalogModal(id) {
  searchInput.blur();
  modalMode = "CATALOG";
  currentItem = MATERIALS[id];
  const key = currentItem.code !== "SIN CÓDIGO" ? `${currentItem.code}_${currentItem.tIdx}` : `SC_${currentItem.name}_${currentItem.tIdx}`;
  const existing = cart.find(c => c.key === key);

  document.getElementById("mCode").textContent = `${currentItem.code} · (${currentItem.tableName})`;
  document.getElementById("mTitle").textContent = currentItem.name;
  document.getElementById("puntualFields").style.display = "none";
  document.getElementById("cableHelper").style.display = CABLE_CODES.has(currentItem.code) ? "flex" : "none";

  document.getElementById("mQtyInput").value = existing ? existing.qty : 1;
  document.getElementById("mNoteInput").value = existing ? (existing.note || "") : "";
  document.getElementById("itemModal").classList.add("open");
}

function openPuntualModal() {
  searchInput.blur();
  modalMode = "PUNTUAL";
  currentItem = null;
  const typed = searchInput.value.trim();

  document.getElementById("mCode").textContent = "SIN CÓDIGO";
  document.getElementById("mTitle").textContent = "Material puntual";
  document.getElementById("puntualFields").style.display = "block";
  document.getElementById("cableHelper").style.display = "none";

  document.getElementById("pNameInput").value = typed;
  document.getElementById("pProvSelect").value = "VERDEJO (1846)";
  document.getElementById("pCustomProvWrap").style.display = "none";
  document.getElementById("pCustomProvInput").value = "";
  document.getElementById("mQtyInput").value = 1;
  document.getElementById("mNoteInput").value = "";
  document.getElementById("itemModal").classList.add("open");
}

function toggleCustomProvInput() {
  const val = document.getElementById("pProvSelect").value;
  document.getElementById("pCustomProvWrap").style.display = val === "OTRO" ? "block" : "none";
}

function stepQty(d) {
  const el = document.getElementById("mQtyInput");
  el.value = Math.max(1, (parseInt(el.value || "1", 10) + d));
}
function addQty(n) {
  const el = document.getElementById("mQtyInput");
  el.value = Math.max(1, (parseInt(el.value || "0", 10) + n));
}
function resetQty() {
  document.getElementById("mQtyInput").value = 1;
  document.getElementById("mNoteInput").value = "";
}
function setQuickCable(q, note) {
  document.getElementById("mQtyInput").value = q;
  document.getElementById("mNoteInput").value = note;
}

function confirmModalItem() {
  const qty = Math.max(1, parseInt(document.getElementById("mQtyInput").value || "1", 10));
  const note = document.getElementById("mNoteInput").value.trim();

  if (modalMode === "PUNTUAL") {
    const name = document.getElementById("pNameInput").value.trim();
    if (!name) return;
    let prov = document.getElementById("pProvSelect").value;
    if (prov === "OTRO") {
      prov = document.getElementById("pCustomProvInput").value.trim() || "Se desconoce proveedor";
    }
    cart.push({
      key: `PUNTUAL_${Date.now()}`,
      code: "PUNTUAL",
      name,
      tableName: "MATERIAL PUNTUAL",
      prov,
      qty,
      note
    });
  } else if (currentItem) {
    const key = currentItem.code !== "SIN CÓDIGO" ? `${currentItem.code}_${currentItem.tIdx}` : `SC_${currentItem.name}_${currentItem.tIdx}`;
    const idx = cart.findIndex(c => c.key === key);
    const obj = {
      key,
      code: currentItem.code,
      name: currentItem.name,
      tableName: currentItem.tableName,
      prov: currentItem.prov,
      qty,
      note
    };
    if (idx >= 0) cart[idx] = obj;
    else cart.push(obj);
  }

  closeModals();
  clearSearch();
  saveCart();
  showToast("Añadido");
}

function toggleExpandCartItem(key) {
  if (expandedCartKeys.has(key)) expandedCartKeys.delete(key);
  else expandedCartKeys.add(key);
  renderCart();
}

function changeCartQty(idx, delta) {
  cart[idx].qty += delta;
  if (cart[idx].qty <= 0) cart.splice(idx, 1);
  saveCart();
}

function removeCartIdx(idx) {
  cart.splice(idx, 1);
  saveCart();
}

function clearCart() {
  if (!cart.length) return;
  if (confirm("¿Vaciar albarán?")) {
    cart = [];
    cancelEditKit();
    saveCart();
  }
}

function saveCart() {
  localStorage.setItem("acacio_v4_cart", JSON.stringify(cart));
  renderCart();
  renderMaterials();
}

function renderCart() {
  const sectionEl = document.getElementById("orderSection");
  const tbodyEl = document.getElementById("cartTableBody");
  document.getElementById("cartCount").textContent = cart.length;
  updateBottomBar();

  if (!cart.length && editingKitIndex === null) {
    sectionEl.style.display = "none";
    tbodyEl.innerHTML = "";
    return;
  }

  sectionEl.style.display = "block";
  tbodyEl.innerHTML = cart.map((item, i) => {
    const isExp = expandedCartKeys.has(item.key);
    const safeKey = item.key.replace(/'/g, "\\'");
    const codeDisplay = item.code === "SIN CÓDIGO"
      ? "SIN CÓDIGO"
      : item.code === "PUNTUAL"
        ? "PUNTUAL"
        : item.code;

    return `
      <div class="alb-row ${isExp ? 'expanded' : ''}">
        <span class="alb-num">${i + 1}.</span>
        <span class="alb-qty">${item.qty} u.</span>
        <div class="alb-info" onclick="toggleExpandCartItem('${safeKey}')">
          <div class="alb-code">${codeDisplay} ${item.note ? '(' + item.note + ')' : ''}</div>
          <div class="alb-desc">${item.name} (${item.tableName})</div>
          <div class="alb-prov">Proveedor: ${item.prov}</div>
        </div>
        <div class="alb-ctrls">
          <button class="circle-btn" onclick="changeCartQty(${i}, -1)">−</button>
          <button class="circle-btn" onclick="changeCartQty(${i}, 1)">+</button>
          <button class="circle-btn del" onclick="removeCartIdx(${i})">✕</button>
        </div>
      </div>
    `;
  }).join("");
}

function updateBottomBar() {
  const bar = document.getElementById("bottomBar");
  const isOrderView = document.getElementById("orderView").style.display !== "none";
  if (cart.length > 0 && isOrderView) {
    bar.style.display = "flex";
    document.getElementById("bottomBarText").textContent = `${cart.length} en albarán`;
  } else {
    bar.style.display = "none";
  }
}

function buildOfficialText() {
  if (!cart.length) return "";
  const coded = cart.filter(c => c.code !== "SIN CÓDIGO" && c.code !== "PUNTUAL");
  const uncodedCatalog = cart.filter(c => c.code === "SIN CÓDIGO");
  const puntualItems = cart.filter(c => c.code === "PUNTUAL");

  const lines = [];
  coded.forEach(c => {
    lines.push(`${c.code} – ${c.qty} unidades${c.note ? ' (' + c.note + ')' : ''}`);
  });

  uncodedCatalog.forEach(u => {
    lines.push(`SIN CÓDIGO – ${u.name} (${u.tableName}) – ${u.qty} unidades (Proveedor: ${u.prov})${u.note ? ' [' + u.note + ']' : ''}`);
  });

  if (puntualItems.length > 0) {
    if (lines.length > 0) lines.push("");
    lines.push("Material puntual:");
    puntualItems.forEach(p => {
      lines.push(`- ${p.name} – ${p.qty} unidades (Proveedor: ${p.prov})${p.note ? ' [' + p.note + ']' : ''}`);
    });
  }

  return lines.join("\n");
}

function copyOrder() {
  const txt = buildOfficialText();
  if (!txt) return;
  navigator.clipboard.writeText(txt).then(() => showToast("Pedido copiado"));
}

function sendEmail() {
  const txt = buildOfficialText();
  if (!txt) return;
  const dateStr = new Date().toLocaleDateString("es-ES");
  window.location.href = `mailto:?subject=${encodeURIComponent('Pedido de material - ' + dateStr)}&body=${encodeURIComponent(txt)}`;
}

function sendWhatsApp() {
  const txt = buildOfficialText();
  if (!txt) return;
  window.open(`https://wa.me/?text=${encodeURIComponent(txt)}`, "_blank");
}

function updateKitsBadge() {
  document.getElementById("kitsBtn").textContent = `Kits (${userKits.length})`;
}

function promptSaveCurrentAsKit() {
  if (!cart.length) return;
  const def = editingKitIndex !== null && userKits[editingKitIndex] ? userKits[editingKitIndex].name : "";
  const name = prompt("Nombre del Kit:", def);
  if (!name || !name.trim()) return;

  const kitObj = { name: name.trim(), items: JSON.parse(JSON.stringify(cart)) };
  if (editingKitIndex !== null && userKits[editingKitIndex]) {
    userKits[editingKitIndex] = kitObj;
    cancelEditKit();
    showToast("Kit actualizado");
  } else {
    userKits.push(kitObj);
    showToast("Kit guardado");
  }
  localStorage.setItem("acacio_v4_kits", JSON.stringify(userKits));
  updateKitsBadge();
}

function openKitsModal() {
  renderKitsList();
  document.getElementById("kitsModal").classList.add("open");
}

function renderKitsList() {
  const box = document.getElementById("kitsContainer");
  if (!userKits.length) {
    box.innerHTML = `<div style="padding:20px 0;color:var(--muted);font-size:0.85rem;text-align:center;">Sin kits guardados</div>`;
    return;
  }
  box.innerHTML = userKits.map((k, idx) => {
    const summary = k.items.map(it => `${it.code !== 'SIN CÓDIGO' && it.code !== 'PUNTUAL' ? it.code : it.name} (${it.qty})`).join(", ");
    return `
      <div class="kit-row">
        <div style="flex:1;min-width:0;">
          <div class="kit-title">${k.name}</div>
          <div class="kit-sub">${summary}</div>
        </div>
        <div style="display:flex;gap:10px;align-items:center;">
          <button class="text-btn" style="color:var(--success);" onclick="loadUserKit(${idx})">Cargar</button>
          <button class="text-btn" onclick="startEditUserKit(${idx})">Editar</button>
          <button class="text-btn" style="color:var(--danger);" onclick="deleteUserKit(${idx})">✕</button>
        </div>
      </div>
    `;
  }).join("");
}

function loadUserKit(idx) {
  const kit = userKits[idx];
  if (!kit) return;
  kit.items.forEach(kItem => {
    const existing = cart.find(c => c.key === kItem.key);
    if (existing) existing.qty += kItem.qty;
    else cart.push(JSON.parse(JSON.stringify(kItem)));
  });
  saveCart();
  closeModals();
  showToast(`Kit "${kit.name}" cargado`);
}

function startEditUserKit(idx) {
  const kit = userKits[idx];
  if (!kit) return;
  editingKitIndex = idx;
  cart = JSON.parse(JSON.stringify(kit.items));
  document.getElementById("editingKitName").textContent = kit.name;
  document.getElementById("editKitBanner").style.display = "flex";
  saveCart();
  closeModals();
  scrollToOrder();
}

function saveEditedKit() {
  if (editingKitIndex === null || !userKits[editingKitIndex]) return;
  const newName = prompt("Nombre del Kit:", userKits[editingKitIndex].name);
  if (!newName || !newName.trim()) return;
  userKits[editingKitIndex] = { name: newName.trim(), items: JSON.parse(JSON.stringify(cart)) };
  localStorage.setItem("acacio_v4_kits", JSON.stringify(userKits));
  updateKitsBadge();
  cancelEditKit();
  renderCart();
  showToast("Kit actualizado");
}

function cancelEditKit() {
  editingKitIndex = null;
  document.getElementById("editKitBanner").style.display = "none";
  renderCart();
}

function deleteUserKit(idx) {
  if (!confirm(`¿Eliminar "${userKits[idx].name}"?`)) return;
  userKits.splice(idx, 1);
  localStorage.setItem("acacio_v4_kits", JSON.stringify(userKits));
  updateKitsBadge();
  renderKitsList();
}

function pasteFromClipboard() {
  navigator.clipboard.readText().then(t => {
    document.getElementById("transInput").value = t;
    runTranslator();
  }).catch(() => {});
}

function clearTranslator() {
  document.getElementById("transInput").value = "";
  runTranslator();
}

function runTranslator() {
  const raw = document.getElementById("transInput").value;
  const out = document.getElementById("transOutput");
  const lines = raw.split(/\r?\n/).map(l => l.trim()).filter(Boolean);

  if (!lines.length) {
    out.innerHTML = "";
    return;
  }

  const parsed = [];
  lines.forEach(line => {
    const m = line.match(/^(\d{3,5})\s*[-–—:]?\s*(\d+)?\s*(?:unidades|uds|u|m|metros)?\s*(.*)$/i);
    if (m) {
      const code = m[1];
      const qty = m[2] ? m[2] : "1";
      const extra = m[3] ? m[3].trim() : "";
      const found = CODE_MAP[code];
      parsed.push({
        type: found ? "FOUND" : "UNKNOWN",
        code,
        qty,
        extra,
        mat: found,
        rawLine: line
      });
    } else if (!/^material puntual|^correo:/i.test(line)) {
      parsed.push({ type: "TEXT", rawLine: line });
    }
  });

  out.innerHTML = parsed.map(p => {
    if (p.type === "FOUND") {
      const tableTags = p.mat.tables.map(t => `(${t})`).join(" ");
      return `
        <div class="trans-row" onclick="this.classList.toggle('checked')">
          <div class="trans-check">✓</div>
          <div style="flex:1;">
            <div style="display:flex;justify-content:space-between;align-items:baseline;">
              <span class="mat-code">${p.code}</span>
              <span class="alb-qty">${p.qty} u.</span>
            </div>
            <div class="mat-name" style="margin-top:2px;">
              ${p.mat.name} <span class="mat-table-tag">${tableTags}</span>
            </div>
            <div style="font-size:0.74rem;color:var(--muted);margin-top:2px;">
              ${p.mat.prov} ${p.extra ? ' · ' + p.extra : ''}
            </div>
          </div>
        </div>
      `;
    } else if (p.type === "UNKNOWN") {
      return `
        <div class="trans-row" onclick="this.classList.toggle('checked')">
          <div class="trans-check">✓</div>
          <div style="flex:1;">
            <span class="mat-code sc">${p.code}</span>
            <div style="color:var(--danger);font-size:0.86rem;margin-top:2px;">Código no encontrado (${p.qty} u.)</div>
          </div>
        </div>
      `;
    } else {
      return `
        <div class="trans-row" onclick="this.classList.toggle('checked')">
          <div class="trans-check">✓</div>
          <div style="flex:1;">
            <div style="font-size:0.86rem;">${p.rawLine}</div>
          </div>
        </div>
      `;
    }
  }).join("");
}

function closeModals() {
  document.querySelectorAll(".modal-backdrop").forEach(m => {
    if (m.id !== "conflictModal") m.classList.remove("open");
  });
}

function scrollToOrder() {
  document.getElementById("orderSection").scrollIntoView({ behavior: "smooth" });
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.style.display = "block";
  setTimeout(() => { t.style.display = "none"; }, 1800);
}

const manifest = {
  name: "Material Acaciophone",
  short_name: "Acaciophone",
  start_url: ".",
  display: "standalone",
  background_color: "#090d16",
  theme_color: "#090d16",
  icons: [{
    src: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230284c7'/><text x='50%' y='58%' dominant-baseline='middle' text-anchor='middle' font-size='54'>⚡</text></svg>",
    sizes: "192x192",
    type: "image/svg+xml"
  }]
};
document.getElementById("pwa-manifest").setAttribute(
  "href",
  "data:application/manifest+json;charset=utf-8," + encodeURIComponent(JSON.stringify(manifest))
);

updateKitsBadge();
renderMaterials();
renderCart();
</script>
